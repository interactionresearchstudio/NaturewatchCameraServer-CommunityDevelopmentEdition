---
name: Build Image
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  # Base image used by CustomPiOS. Update both values together when upgrading.
  BASE_IMAGE_DATE: "2026-10-06"
  BASE_IMAGE_FILE: "2026-10-06-raspios-trixie-armhf-lite"
  BASE_IMAGE_SHA256: "2c302771f34c67a0b7ae7aa2e0dcdd3eac660504be59193c011ba79d412e1632"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies and enable QEMU binfmt
        run: |
          set -euo pipefail

          # Install build dependencies and QEMU user-mode emulatio
          sudo apt-get update
          sudo apt-get install -y \
            coreutils \
            p7zip-full \
            file \
            qemu-user-binfmt \
            qemu-system-arm \
            binfmt-support \
            systemd \
            python3-git

          # Activate binfmt registrations
          sudo systemctl restart systemd-binfmt

      - name: Checkout CustomPiOS
        uses: actions/checkout@v4
        with:
          repository: "guysoft/CustomPiOS"
          ref: 4fd13d6b65a54b2b528a4a52db214b2d4568392d
          path: CustomPiOS

      - name: Checkout Project Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: repository

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build React frontend
        run: |
          cd repository/naturewatch_camera_server/static/client
          npm ci
          NODE_OPTIONS=--openssl-legacy-provider npm run build

      - name: Download Raspberry Pi OS Lite (32-bit)
        run: |
          cd repository/os/image
          wget -q -c --trust-server-names \
            https://downloads.raspberrypi.org/raspios_lite_armhf/images/raspios_lite_armhf-${{ env.BASE_IMAGE_DATE }}/${{ env.BASE_IMAGE_FILE }}.img.xz
          echo "${BASE_IMAGE_SHA256}  ${BASE_IMAGE_FILE}.img.xz" | sha256sum --check

      - name: Update CustomPiOS Paths
        run: |
          cd repository/os
          ../../CustomPiOS/src/update-custompios-paths

      - name: Copy NaturewatchCameraServer to CustomPiOS directory
        run: |
          cp -r repository /tmp/NaturewatchCameraServer
          rm -rf /tmp/NaturewatchCameraServer/os
          # Remove nodejs build files
          rm -rf /tmp/NaturewatchCameraServer/naturewatch_camera_server/static/client/node_modules
          # Move the project within a new directory
          cp -r /tmp/NaturewatchCameraServer repository/os/modules/naturewatchcamera/filesystem/home/pi
          rm -rf /tmp/NaturewatchCameraServer
          ls repository/os/modules/naturewatchcamera/filesystem/home/pi/NaturewatchCameraServer

      - name: Build Image
        run: |
          cd repository/os
          sudo modprobe loop
          sudo env BASE_IMAGE_ENLARGEROOT=2000 bash -x ./build_dist

      - name: Copy Output
        run: |
          cp ${{ github.workspace }}/repository/os/workspace/${{ env.BASE_IMAGE_FILE }}.img mynaturewatch-camera.img

      - name: Zip Output
        run: gzip mynaturewatch-camera.img

      - uses: actions/upload-artifact@v4
        with:
          name: mynaturewatch-camera.img.gz
          path: mynaturewatch-camera.img.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Image
        uses: actions/download-artifact@v4
        with:
          name: mynaturewatch-camera.img.gz

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: My Naturewatch Camera ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: mynaturewatch-camera.img.gz