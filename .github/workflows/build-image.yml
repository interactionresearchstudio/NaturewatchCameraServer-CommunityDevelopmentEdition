---
name: Build Image
on: [push, pull_request, workflow_dispatch]

env:
  # Keep every apt invocation in every step non-interactive: a debconf prompt
  # inside the chroot build stalls the job until it times out.
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Repository
        uses: actions/checkout@v4

      - name: Install Dependencies and enable QEMU binfmt
        run: |
          # The armhf chroot build needs qemu-arm registered with the binfmt
          # fix-binary (F) flag, and CustomPiOS chroots through
          # /usr/bin/qemu-arm-static, which must be a REAL static binary.
          # Ubuntu <= 24.04 ships that in qemu-user-static. From 26.04 that
          # package is only a virtual shim: its handlers point at dynamic
          # interpreters, which cannot be exec'd through binfmt inside a
          # chroot (the dynamic loader path does not exist there), so we fall
          # back to vendoring Debian's last static build and registering the
          # handlers ourselves.
          sudo modprobe binfmt_misc 2>/dev/null || true
          mountpoint -q /proc/sys/fs/binfmt_misc || sudo mount binfmt_misc -t binfmt_misc /proc/sys/fs/binfmt_misc
          sudo apt-get update
          sudo apt-get install -y coreutils p7zip-full file qemu-system-arm python3-git
          if sudo apt-get install -y qemu-user-static; then
            echo "Installed qemu-user-static (static emulators + binfmt handlers)."
          else
            echo "qemu-user-static has no installation candidate; vendoring static emulators from Debian."
            tmpq=$(mktemp -d)
            fetch_static_deb() {
              # Prefer the newest 7.2 (bookworm) build; fall back to whatever
              # else is in the pool if that series ever disappears.
              deb=$(curl -fsSL http://deb.debian.org/debian/pool/main/q/qemu/ \
                | grep -oE 'qemu-user-static_'"$1"'[^"]*_amd64\.deb' | sort -uV | tail -1)
              [ -n "$deb" ] || return 1
              curl -fsSL -o "$tmpq/qus.deb" "http://deb.debian.org/debian/pool/main/q/qemu/$deb"
              dpkg-deb -x "$tmpq/qus.deb" "$tmpq/x"
              file "$tmpq/x/usr/bin/qemu-arm-static" | grep -qE 'static-pie linked|statically linked'
            }
            fetch_static_deb '7\.2' || fetch_static_deb ''
            file "$tmpq/x/usr/bin/qemu-arm-static" | grep -qE 'static-pie linked|statically linked' \
              || { echo "Vendored qemu-arm-static is not a static binary; cannot build"; exit 1; }
            sudo cp "$tmpq/x/usr/bin/qemu-arm-static" "$tmpq/x/usr/bin/qemu-aarch64-static" /usr/bin/
            register_handler() {
              local name="$1" magic="$2" mask="$3"
              if [ -e "/proc/sys/fs/binfmt_misc/$name" ]; then
                echo -1 | sudo tee "/proc/sys/fs/binfmt_misc/$name" >/dev/null
              fi
              printf ":$name:M::$magic:$mask:/usr/bin/$name-static:F" | sudo tee /proc/sys/fs/binfmt_misc/register >/dev/null
            }
            # Magic/mask values taken from Debian's qemu-user-static binfmt templates.
            register_handler qemu-arm \
              '\x7f\x45\x4c\x46\x01\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x28\x00' \
              '\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff'
            register_handler qemu-aarch64 \
              '\x7f\x45\x4c\x46\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\xb7\x00' \
              '\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff'
          fi
          # The armhf chroot build needs the 32-bit ARM handler specifically.
          test -e /proc/sys/fs/binfmt_misc/qemu-arm || { echo "qemu-arm binfmt handler is missing"; exit 1; }
          echo "--- Registered binfmt handlers ---"
          ls /proc/sys/fs/binfmt_misc/ | grep qemu

      - name: Checkout CustomPiOS
        uses: actions/checkout@v4
        with:
          repository: "guysoft/CustomPiOS"
          ref: devel
          path: CustomPiOS

      - name: Make package upgrades non-interactive
        run: |
          sed -i 's/apt-get upgrade -y/DEBIAN_FRONTEND=noninteractive apt-get upgrade -y -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold/' \
            CustomPiOS/src/modules/admin-toolkit/start_chroot_script

      - name: Checkout Project Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: repository

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 12

      - name: Build React frontend
        run: |
          pushd repository/naturewatch_camera_server/static/client
          npm i -y
          npm run build
          popd

      - name: Download Raspbian Image
        run: |
          cd repository/os/image
          wget -q -c --trust-server-names 'https://downloads.raspberrypi.org/raspios_lite_armhf/images/raspios_lite_armhf-2024-11-19/2024-11-19-raspios-bookworm-armhf-lite.img.xz'

      - name: Update CustomPiOS Paths
        run: |
          cd repository/os
          ../../CustomPiOS/src/update-custompios-paths

      - name: Copy NaturewatchCameraServer to CustomPiOS directory
        run: |
          cp -r repository /tmp/NaturewatchCameraServer
          rm -rf /tmp/NaturewatchCameraServer/os
          # Remove nodejs build files
          rm -rf /tmp/NaturewatchCameraServer/naturewatch_camera_server/static/client/node_modules
          # Move the project within a new directory
          cp -r /tmp/NaturewatchCameraServer repository/os/modules/naturewatchcamera/filesystem/home/pi
          rm -rf /tmp/NaturewatchCameraServer
          ls repository/os/modules/naturewatchcamera/filesystem/home/pi/NaturewatchCameraServer

      - name: Build Image
        run: |
          export BASE_IMAGE_ENLARGEROOT=2000
          # Password set in os/config
          # export AUTO_HOTSPOT_NAME=MyNaturewatch
          # export AUTO_HOTSPOT_PASSWORD=badgersandfoxes
          sudo modprobe loop && cd repository/os
          sudo bash -x ./build_dist

      - name: Copy Output
        run: |
          cp ${{ github.workspace }}/repository/os/workspace/*lite.img mynaturewatch-camera.img
          # Free the intermediate copy: runners have limited disk and the boot
          # test below makes its own per-board copies of the final image.
          rm -f ${{ github.workspace }}/repository/os/workspace/*lite.img

      - name: Test Image Boots Under QEMU
        timeout-minutes: 45
        run: |
          # The script only ever mounts the passed image read-only and boots
          # per-board copies of it, so the shipped file stays pristine. One
          # boot per supported board family (Pi 3 A+/Zero 2 W, Pi 3 B, Pi 4).
          bash os/test_image_boot.sh mynaturewatch-camera.img 600 qemu-boot

      - name: Upload Boot Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-boot-logs
          path: qemu-boot-*.log
          if-no-files-found: ignore

      - name: Zip Output
        run: gzip mynaturewatch-camera.img

      - uses: actions/upload-artifact@v4
        with:
          name: mynaturewatch-camera.img.gz
          path: mynaturewatch-camera.img.gz

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref }}
          name: My Naturewatch Camera ${{ github.ref }}
          draft: true
          prerelease: false
          files: mynaturewatch-camera.img.gz
